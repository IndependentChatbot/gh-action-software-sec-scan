name: Set initial environment
run-name: ${{ github.actor }} running GitHub Actions

# Controls when the workflow will run
on:
  push:
    branches:
      - 'main'
    paths-ignore: # Pushes that change only these files won't start the workflow
      - 'README.md'
      - '**.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
    
  pull_request:
    branches:
      - 'dev'
 # Run this workflow manually from the Actions tab
  workflow_dispatch:
    
jobs:
  test:
    name: test
    strategy:
      matrix:
        os: [ macos, ubuntu ]
        #custom_token: [ true, false ]
    runs-on: ${{ matrix.os }}-latest # Interpolating a variable value
    steps:
      - name: Checkout entire repository
        uses: actions/checkout@v7
        with:
          path: action
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - run: echo "Job - test -> Status is ${{ job.status }}."

  build:
    name: build
    strategy:
      matrix:
        os: [ macos, ubuntu]
        include:
          #- jvm_version: [25.x] # Arbitrary variables
          - node-version: [24.x]
          #- python_version: [3.9.x, 3.16.x]
    runs-on: ${{ matrix.os }}-latest # Interpolating a variable value
    steps:
      - name: Checkout entire repository
        uses: actions/checkout@v7
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - name: Set Node.js
        uses: actions/setup-node@v6
        #with:
          #node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Rebuild the dist/ directory
        run: npm run package
        
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: actions/setup-python@v7
        #with:
          #python-version: ${{ matrix.python_version }} 
      - shell: bash
        run: java -version
      - shell: bash
        run: python --version     

      # If index.js different than expected, upload expected version as an artifact
      # Add a 'git diff' task again
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: dist
          path: dist/ 
          
      - run: echo "Job - build -> Status is ${{ job.status }}."
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan a webapplication
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          #token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://www.zaproxy.org'
          rules_file_name: '.zap/rules.tsv'
          #Issue with 'writing issue using GH web API'
          allow_issue_writing: false
          cmd_options: '-a'
      
      - run: echo "Job - zap_scan -> Status is ${{ job.status }}."

  download:
    needs: zap_scan
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts
        pattern: artifacts-*
        merge-multiple: true
    - run: ls -R ./artifacts
    - run: pwd

    - run: echo "Job - download -> Status is ${{ job.status }}."
  
